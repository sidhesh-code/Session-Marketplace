version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sessions_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sessions_db}
      POSTGRES_USER: ${POSTGRES_USER:-sessions_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sessions_secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sessions_user} -d ${POSTGRES_DB:-sessions_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sessions_backend
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sessions_db}
      POSTGRES_USER: ${POSTGRES_USER:-sessions_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sessions_secure_password_123}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-key-9812739}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/callback}
      JWT_ACCESS_LIFETIME_MINUTES: ${JWT_ACCESS_LIFETIME_MINUTES:-60}
      JWT_REFRESH_LIFETIME_DAYS: ${JWT_REFRESH_LIFETIME_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sessions_frontend
    restart: always
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: sessions_nginx
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
    name: postgres_data
